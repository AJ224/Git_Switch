name: Publish Extension

on:
  workflow_dispatch:
  push:
    tags:
      - "extension-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package
        run: npx vsce package --no-dependencies

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: git-switch-vsix
          path: extension/*.vsix

      # Uses Marketplace Trusted Publishing (no VSCE_PAT needed)
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --no-dependencies --oidc

      # Open VSX still needs a token (Cursor). Optional.
      - name: Publish to Open VSX
        if: ${{ secrets.OVSX_PAT != '' }}
        run: npx ovsx publish --no-dependencies -p ${{ secrets.OVSX_PAT }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
