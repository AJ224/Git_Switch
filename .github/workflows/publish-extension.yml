name: Publish Extension

on:
  workflow_dispatch:
  push:
    tags:
      - "extension-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    env:
      # Map secret → env so `if` can check it (secrets.* is not allowed in if)
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package
        run: npx vsce package --no-dependencies

      - name: Upload VSIX
        uses: actions/upload-artifact@v5
        with:
          name: git-switch-vsix
          path: extension/*.vsix

      # Marketplace Trusted Publishing (OIDC — no VSCE_PAT)
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --no-dependencies --oidc

      # Cursor / Open VSX (optional — set repo secret OVSX_PAT)
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish --no-dependencies -p "$OVSX_PAT"
